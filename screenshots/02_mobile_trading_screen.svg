  <text x="216" y="345" fill="#EF4444" font-family="SF Pro Display, Inter, sans-serif" font-size="11">Stop Loss</text>
  <text x="216" y="365" fill="#F1F5F9" font-family="SF Pro Display, Inter, sans-serif" font-size="15" font-weight="500">64,000</text>

  <!-- Order summary -->
  <rect x="16" y="391" width="358" height="100" rx="12" fill="#111118" stroke="#1F2033" stroke-width="1"/>
  <text x="30" y="412" fill="#94A3B8" font-family="SF Pro Display, Inter, sans-serif" font-size="12">Order Summary</text>
  <text x="30" y="436" fill="#94A3B8" font-family="SF Pro Display, Inter, sans-serif" font-size="13">Cost</text>
  <text x="358" y="436" fill="#F1F5F9" font-family="SF Pro Display, Inter, sans-serif" font-size="13" font-weight="600" text-anchor="end">$67.23 USDT</text>
  <text x="30" y="458" fill="#94A3B8" font-family="SF Pro Display, Inter, sans-serif" font-size="13">Est. Fee (0.1%)</text>
  <text x="358" y="458" fill="#F59E0B" font-family="SF Pro Display, Inter, sans-serif" font-size="13" font-weight="600" text-anchor="end">$0.07 USDT</text>
  <text x="30" y="480" fill="#94A3B8" font-family="SF Pro Display, Inter, sans-serif" font-size="13">Available</text>
  <text x="358" y="480" fill="#22C55E" font-family="SF Pro Display, Inter, sans-serif" font-size="13" font-weight="600" text-anchor="end">$9,932.77 USDT</text>

  <!-- Place order button -->
  <rect x="16" y="505" width="358" height="54" rx="12" fill="url(#buyBtn)"/>
  <text x="195" y="536" fill="white" font-family="SF Pro Display, Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Buy BTC</text>

  <!-- Percentage quick select -->
  <text x="30" y="580" fill="#94A3B8" font-family="SF Pro Display, Inter, sans-serif" font-size="12">Quick %</text>
  <rect x="16" y="589" width="78" height="28" rx="6" fill="#1F2033"/>
  <text x="55" y="607" fill="#94A3B8" font-family="SF Pro Display, Inter, sans-serif" font-size="12" text-anchor="middle">25%</text>
  <rect x="102" y="589" width="78" height="28" rx="6" fill="#1F2033"/>
  <text x="141" y="607" fill="#94A3B8" font-family="SF Pro Display, Inter, sans-serif" font-size="12" text-anchor="middle">50%</text>
  <rect x="188" y="589" width="78" height="28" rx="6" fill="#1F2033"/>
  <text x="227" y="607" fill="#94A3B8" font-family="SF Pro Display, Inter, sans-serif" font-size="12" text-anchor="middle">75%</text>
  <rect x="274" y="589" width="100" height="28" rx="6" fill="#3B82F6" fill-opacity="0.2" stroke="#3B82F6" stroke-width="1"/>
  <text x="324" y="607" fill="#3B82F6" font-family="SF Pro Display, Inter, sans-serif" font-size="12" text-anchor="middle">100%</text>

  <!-- Bottom nav bar -->
  <rect x="0" y="750" width="390" height="94" fill="#111118"/>
  <rect x="0" y="750" width="390" height="1" fill="#1F2033"/>
  <text x="39" y="779" fill="#475569" font-family="SF Pro Display, Inter, sans-serif" font-size="16" text-anchor="middle">📊</text>
  <text x="39" y="798" fill="#475569" font-family="SF Pro Display, Inter, sans-serif" font-size="10" text-anchor="middle">Markets</text>
  <text x="117" y="779" fill="#3B82F6" font-family="SF Pro Display, Inter, sans-serif" font-size="16" text-anchor="middle">🔄</text>
  <text x="117" y="798" fill="#3B82F6" font-family="SF Pro Display, Inter, sans-serif" font-size="10" text-anchor="middle" font-weight="600">Trade</text>
  <text x="195" y="779" fill="#475569" font-family="SF Pro Display, Inter, sans-serif" font-size="16" text-anchor="middle">📈</text>
  <text x="195" y="798" fill="#475569" font-family="SF Pro Display, Inter, sans-serif" font-size="10" text-anchor="middle">Positions</text>
  <text x="273" y="779" fill="#475569" font-family="SF Pro Display, Inter, sans-serif" font-size="16" text-anchor="middle">👛</text>
  <text x="273" y="798" fill="#475569" font-family="SF Pro Display, Inter, sans-serif" font-size="10" text-anchor="middle">Wallet</text>
  <text x="351" y="779" fill="#475569" font-family="SF Pro Display, Inter, sans-serif" font-size="16" text-anchor="middle">👤</text>
  <text x="351" y="798" fill="#475569" font-family="SF Pro Display, Inter, sans-serif" font-size="10" text-anchor="middle">Profile</text>
  <rect x="155" y="820" width="80" height="4" rx="2" fill="#94A3B8" fill-opacity="0.4"/>
  <rect x="1" y="1" width="388" height="842" rx="43" fill="none" stroke="#2A2A3E" stroke-width="1"/>
</svg>
