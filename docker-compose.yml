version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: crypto_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cryptouser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cryptopass}
      POSTGRES_DB: ${POSTGRES_DB:-cryptopaper}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptouser -d cryptopaper"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crypto_network

  redis:
    image: redis:7-alpine
    container_name: crypto_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crypto_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crypto_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cryptouser}:${POSTGRES_PASSWORD:-cryptopass}@postgres:5432/${POSTGRES_DB:-cryptopaper}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispass}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-super-secret-key-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      BINANCE_WS_URL: wss://stream.binance.com:9443/ws
      BINANCE_REST_URL: https://api.binance.com
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEFAULT_WALLET_BALANCE: 10000.0
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@cryptopaper.com}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - crypto_network
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crypto_celery
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cryptouser}:${POSTGRES_PASSWORD:-cryptopass}@postgres:5432/${POSTGRES_DB:-cryptopaper}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispass}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-super-secret-key-change-in-production}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redispass}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redispass}@redis:6379/2
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app
    networks:
      - crypto_network
    restart: unless-stopped

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crypto_celery_beat
    command: celery -A app.core.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cryptouser}:${POSTGRES_PASSWORD:-cryptopass}@postgres:5432/${POSTGRES_DB:-cryptopaper}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispass}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-super-secret-key-change-in-production}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redispass}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redispass}@redis:6379/2
    depends_on:
      - celery_worker
    volumes:
      - ./backend:/app
    networks:
      - crypto_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: crypto_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
    networks:
      - crypto_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  crypto_network:
    driver: bridge
